<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flow</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/canvas.css">
<link rel="stylesheet" href="css/gate.css">
<link rel="stylesheet" href="css/toast.css">
<link rel="stylesheet" href="css/update.css">
</head>
<body>
  <div class="app">

    <!-- 顶栏 -->
    <div class="topbar">
      <div class="logo"><img src="cube-icon.svg" alt="logo">Flow</div>
      <div class="spacer"></div>
      <button class="update-chip" id="updateChip" type="button"
              title="检查更新" data-i18n-title="检查更新"
              aria-label="检查更新" data-i18n-aria="检查更新">
        <span class="update-chip-version" id="updateChipVersion"></span>
        <span class="update-chip-icon" aria-hidden="true">↻</span>
        <span class="update-chip-dot" id="updateChipDot" hidden></span>
      </button>
      <div class="dots">
        <span class="dot-green" data-win="minimize" title="最小化" data-i18n-title="最小化"></span>
        <span class="dot-yellow" data-win="maximize" title="最大化 / 还原" data-i18n-title="最大化 / 还原"></span>
        <span class="dot-red" data-win="close" title="关闭" data-i18n-title="关闭"></span>
      </div>
    </div>

    <!-- 点击 logo 弹出的设置面板：结构与内容由 regions/logo-panel.js 渲染，
         这里只留遮罩和容器，避免重复 ID 与两份事件源。 -->
    <div class="modal-overlay" id="logoPanel">
      <div class="modal modal-logo"></div>
    </div>

    <!-- Agent 配置面板：同样由 regions/agent-panel.js 渲染内部结构 -->
    <div class="modal-overlay" id="agentPanel">
      <div class="modal modal-agent"></div>
    </div>

    <!-- 更新窗口：内部结构由 regions/update-panel.js 渲染 -->
    <div class="modal-overlay" id="updatePanel">
      <div class="modal modal-update"></div>
    </div>

    <!-- 主体 -->
    <div class="body" id="body">

      <!-- 左侧栏：团队列表 -->
      <div class="sidebar" id="sidebar">
        <div class="side-content">
          <div class="item label row">
            <span data-i18n="团队">团队</span>
            <button class="add-btn" type="button" title="新建团队" aria-label="新建团队"
                    data-i18n-title="新建团队" data-i18n-aria="新建团队">＋</button>
          </div>
          <div class="side-divider"></div>
          <div id="teamList"></div>
        </div>
      </div>

      <!-- 分割栏 -->
      <div class="splitter" id="splitter"></div>

      <!-- 右侧主区域：大标题 + 无限画布 -->
      <div class="main" id="main">
        <!-- 手动保存：只在工作区显示；成功后变成绿色 done -->
        <button class="save-btn" id="saveBtn" type="button" hidden><span class="save-bracket">&lt;</span><span class="save-text">save</span><span class="save-bracket">&gt;</span></button>
        <div class="hero-wrap">
          <h1 class="clickable" id="logoClick" role="button" tabindex="0"><span class="logo-inner" id="logoInner">CLICK <span class="orange">&lt;</span><img src="cube-icon.svg" alt=""><span class="orange">&gt;</span></span></h1>
        </div>
        <div class="ws-content">
          <div class="ws-canvas" id="wsCanvas">
            <div class="canvas-dots"></div>
            <div class="canvas-world" id="canvasWorld"></div>
          </div>
        </div>
      </div>

      <!-- 产物查看器：点产物文件后从右侧滑出，宽度可拖，最大不压到左侧栏。
           内部结构由 regions/artifact.js 用组件渲染后填入，这里只留容器。 -->
      <div class="ap-splitter" id="artifactSplitter" hidden></div>
      <aside class="artifact-pane" id="artifactPane" hidden></aside>

    </div>
  </div>

  <!-- 拖卡片时出现在侧栏底部的删除区。
       形状是立方体 logo 的整圈轮廓（六边形描边），尺寸和拖出来那颗一致。
       放在 .app 之外、独立成层：它必须压在画布内容之上，而侧栏是主区域的
       前一个兄弟，留在侧栏里会被后画的卡片盖住。位置由 JS 在拖起来那一刻按
       侧栏的实际矩形算（见 ui/regions/trash-zone.js）。 -->
  <div class="trash-zone" id="trashZone" aria-hidden="true">
    <div class="trash-inner">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <polygon class="trash-shape"
                 points="256,89.45 430.33,107.88 392.52,262.99 476.16,306.93 256,422.55 35.84,306.93 130.19,257.38 130.19,155.52"
                 stroke-width="12" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

<script type="module" src="js/main.js"></script>
</body>
</html>
