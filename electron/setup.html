<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <title>Pi Flow 运行环境</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ece3ce;
      --well: #dbd1b5;
      --raised: #f5eedc;
      --raised-hi: #fffdf4;
      --line: #c9bd9f;
      --ink: #32302a;
      --ink-2: #6e664e;
      --ink-3: #8a8064;
      --orange: #e89a32;
      --orange-top: #eaa03c;
      --orange-bottom: #e2942d;
      --orange-lip: #b97a20;
      --lip: rgba(150, 128, 88, 0.55);
      --danger: #a5442a;
    }
    * { box-sizing: border-box; scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; }
    html { height: 100%; background: transparent; }
    body {
      margin: 8px;
      height: calc(100% - 16px);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      box-shadow: 0 22px 48px rgba(90, 70, 40, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    /* ── 标题栏 ─────────────────────────────── */
    .titlebar {
      -webkit-app-region: drag;
      flex: 0 0 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px 0 20px;
      border-bottom: 1px solid #dfd2b9;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-2);
      letter-spacing: 0.02em;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: block;
      box-shadow: 0 1px 2px rgba(120, 100, 62, 0.35);
    }
    .win-controls {
      display: flex;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      width: 34px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #d9cbaa;
      border-radius: 6px;
      background: var(--raised);
      color: var(--ink-2);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(150, 128, 88, 0.5), 0 -1px 1px rgba(255, 255, 255, 0.9);
      transition: background-color 0.16s ease, color 0.16s ease, transform 0.16s ease,
        box-shadow 0.16s ease;
    }
    .win-btn:hover { background: #fbf3df; color: var(--ink); }
    .win-btn:active {
      transform: translateY(1px);
      box-shadow: inset 2px 2px 4px rgba(136, 115, 77, 0.5);
    }
    .win-btn.close:hover { color: var(--danger); }

    .title-right {
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: no-drag;
    }

    /* ── 语言滑块：与主界面同款红色滑块 ─────── */
    .lang-switch {
      position: relative;
      display: flex;
      width: 86px;
      height: 28px;
      padding: 3px;
      border: 1px solid #701c14;
      border-radius: 7px;
      background: #7d2119;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 225, 210, 0.14);
      overflow: hidden;
    }
    .lang-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border: 1px solid #7a1d13;
      border-radius: 5px;
      background: linear-gradient(#ef7457, #d94f34);
      box-shadow: 0 2px 0 #62160e, 0 -1px 1px rgba(255, 190, 160, 0.75),
        0 3px 6px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.2, 0.7, 0.3, 1),
        width 0.22s cubic-bezier(0.2, 0.7, 0.3, 1),
        height 0.22s cubic-bezier(0.2, 0.7, 0.3, 1), opacity 0.16s ease;
    }
    .lang-btn {
      position: relative;
      z-index: 1;
      flex: 1;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #dfab9a;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 0.16s ease;
    }
    .lang-btn:hover { color: #f7e4d4; }
    .lang-btn.active { color: #fff4e4; }
    .lang-btn:focus-visible { outline: 1px solid #f5eddc; outline-offset: -1px; }

    /* ── 安装 / 日志 滑块 ───────────────────── */
    .toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 14px 22px 0;
    }
    .tabs {
      position: relative;
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--well);
      box-shadow: inset 0 3px 6px rgba(120, 100, 62, 0.3), inset 0 -1px 0 rgba(255, 250, 235, 0.5);
      overflow: hidden;
    }
    .tab-thumb {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-radius: 6px;
      background: var(--raised-hi);
      border: 1px solid #d8ccb0;
      box-shadow: 0 2px 0 var(--lip), 0 -2px 2px rgba(255, 255, 255, 1),
        0 4px 8px -3px rgba(143, 122, 85, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s cubic-bezier(0.2, 0.7, 0.3, 1),
        width 0.22s cubic-bezier(0.2, 0.7, 0.3, 1), height 0.22s cubic-bezier(0.2, 0.7, 0.3, 1),
        opacity 0.16s ease;
    }
    .tab {
      position: relative;
      z-index: 1;
      width: 92px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-2);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.16s ease;
    }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--ink); font-weight: 600; }
    .tab .dot {
      display: none;
      position: absolute;
      top: 8px;
      right: 9px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--orange);
    }
    .tab .dot.show { display: block; }

    /* ── 主体 ───────────────────────────────── */
    .views {
      flex: 1;
      min-height: 0;
      display: flex;
      margin-top: 14px;
    }
    .view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .view.hidden { display: none; }

    .install {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding: 4px 22px 16px;
    }
    .meta {
      margin: 0 0 8px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--orange-bottom);
    }
    .meta.error { color: var(--danger); }
    #stepTitle {
      margin: 0 0 16px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.3;
      color: var(--ink);
    }

    .steps-panel {
      flex: 0 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 12px 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--well);
      box-shadow: inset 0 3px 6px rgba(120, 100, 62, 0.28), inset 0 -1px 0 rgba(255, 250, 235, 0.45);
    }
    .steps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step { padding: 4px 0; }
    .row { display: flex; align-items: center; gap: 10px; }

    .icon {
      flex: 0 0 14px;
      width: 14px;
      height: 14px;
      display: grid;
      place-items: center;
      border-radius: 50%;
    }
    .step.pending .icon { border: 1.5px solid #b4a687; }
    .step.done .icon {
      width: 10px;
      height: 10px;
      margin: 0 2px;
      background: var(--orange);
      box-shadow: 0 -1px 0 #f3c17e, 0 1px 2px rgba(160, 110, 30, 0.35);
    }
    .step.failed .icon {
      border: 1.5px solid var(--danger);
      background: rgba(165, 68, 42, 0.12);
    }
    .step.running .icon {
      border: 2px solid rgba(232, 154, 50, 0.25);
      border-top-color: var(--orange);
      animation: spin 0.85s linear infinite;
    }

    .label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      line-height: 1.4;
      color: var(--ink-2);
    }
    .step.running .label { color: var(--ink); font-weight: 600; }
    .step.done .label { color: var(--ink); }
    .step.failed .label { color: var(--danger); }
    .pct {
      flex: none;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 10px;
      color: var(--ink-3);
    }
    .step.running .pct { color: var(--ink-2); }

    .bar {
      height: 4px;
      margin: 7px 2px 0 24px;
      border-radius: 2px;
      background: #cbbfa3;
      box-shadow: inset 0 1px 1px rgba(120, 100, 62, 0.35);
      overflow: hidden;
    }
    .bar i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: 2px;
      background: var(--orange);
      transition: width 0.35s ease;
    }
    .step.done .bar i { width: 100%; }
    .step.failed .bar i { width: 100%; background: var(--danger); opacity: 0.7; animation: none; }
    .step.running .bar i {
      width: 100%;
      background: linear-gradient(90deg, rgba(232, 154, 50, 0.15), var(--orange), rgba(232, 154, 50, 0.15));
      background-size: 200% 100%;
      animation: shimmer 1.2s linear infinite;
    }
    .step[data-progress] .bar i { animation: none; }

    @keyframes shimmer {
      from { background-position: 100% 0; }
      to { background-position: -100% 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .banner {
      display: none;
      margin: 14px 0 0;
      padding: 10px 12px;
      border: 1px solid rgba(165, 68, 42, 0.35);
      border-radius: 8px;
      background: rgba(165, 68, 42, 0.07);
      color: var(--danger);
      font-size: 11.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 120px;
      overflow: auto;
      user-select: text;
    }
    .banner.show { display: block; }
    .hint {
      flex: none;
      margin: 12px 2px 0;
      font-size: 10.5px;
      line-height: 1.6;
      color: var(--ink-3);
    }

    /* ── 日志 ───────────────────────────────── */
    .log-view { padding: 0 22px 18px; }
    .log {
      flex: 1;
      margin: 0;
      overflow: auto;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--well);
      color: #4a4335;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 10.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
      box-shadow: inset 0 3px 6px rgba(120, 100, 62, 0.26), inset 0 -1px 0 rgba(255, 250, 235, 0.4);
    }
  </style>
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <img class="logo" src="pi-flow-icon.png" alt="" />
      <span data-i18n="Pi Flow 运行环境">Pi Flow 运行环境</span>
    </div>
    <div class="title-right">
      <div id="langSwitch" class="lang-switch" role="radiogroup" aria-label="界面语言"
        data-i18n-aria="界面语言">
        <i id="langThumb" class="lang-thumb" aria-hidden="true"></i>
        <button type="button" class="lang-btn" role="radio" aria-checked="false" tabindex="-1"
          data-lang="zh">ZH</button>
        <button type="button" class="lang-btn active" role="radio" aria-checked="true" tabindex="0"
          data-lang="en">EN</button>
      </div>
      <div class="win-controls">
        <button type="button" id="btnMinimize" class="win-btn" title="最小化"
          data-i18n-title="最小化">&#8211;</button>
        <button type="button" id="btnClose" class="win-btn close" title="关闭"
          data-i18n-title="关闭">&#10005;</button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <i id="tabThumb" class="tab-thumb" aria-hidden="true"></i>
      <button type="button" class="tab active" data-view="install"><span data-i18n="安装">安装</span></button>
      <button type="button" class="tab" data-view="log"><span data-i18n="日志">日志</span><span
          id="logDot" class="dot"></span></button>
    </div>
  </div>

  <div class="views">
    <section id="installView" class="view install">
      <p id="meta" class="meta">STEP 0 / 0 · CHECKING</p>
      <h1 id="stepTitle">正在检查运行环境…</h1>
      <div class="steps-panel">
        <ol id="steps" class="steps"></ol>
      </div>
      <p id="banner" class="banner"></p>
      <p class="hint"
        data-i18n="Blender 已内置在安装包中，无需联网下载。其余依赖首次安装时需要网络，失败后重启应用会接着上次的进度继续。">
        Blender 已内置在安装包中，无需联网下载。其余依赖首次安装时需要网络，失败后重启应用会接着上次的进度继续。
      </p>
    </section>
    <section id="logView" class="view log-view hidden">
      <pre id="log" class="log"></pre>
    </section>
  </div>

  <script src="setup-i18n.js"></script>
  <script>
    const EN = window.SETUP_I18N || {};
    const langSwitchEl = document.getElementById("langSwitch");
    const langButtons = [...langSwitchEl.querySelectorAll(".lang-btn")];
    const langThumb = document.getElementById("langThumb");

    function readSetupLocale() {
      try {
        return localStorage.getItem("pi-flow-setup-locale");
      } catch {
        return null;
      }
    }

    function saveSetupLocale(value) {
      try {
        localStorage.setItem("pi-flow-setup-locale", value);
      } catch {
        // 存储不可用时只影响下次打开。
      }
    }

    let lang = window.resolveSetupLocale
      ? window.resolveSetupLocale(readSetupLocale())
      : "en";

    function t(text) {
      return lang === "en" ? EN[text] ?? text : text;
    }

    const metaEl = document.getElementById("meta");
    const titleEl = document.getElementById("stepTitle");
    const stepsEl = document.getElementById("steps");
    const bannerEl = document.getElementById("banner");
    const logEl = document.getElementById("log");
    const logDotEl = document.getElementById("logDot");
    const installView = document.getElementById("installView");
    const logView = document.getElementById("logView");
    const tabsEl = document.querySelector(".tabs");
    const tabThumb = document.getElementById("tabThumb");
    const tabs = [...document.querySelectorAll(".tab")];

    const rows = [];
    let active = -1;
    let total = 0;
    let view = "install";
    let currentTitle = "正在检查运行环境…";

    function moveThumb(thumb, target, animate) {
      if (!thumb) return;
      if (!target) {
        thumb.style.opacity = "0";
        return;
      }
      if (!animate) thumb.style.transition = "none";
      thumb.style.opacity = "1";
      thumb.style.width = target.offsetWidth + "px";
      thumb.style.height = target.offsetHeight + "px";
      thumb.style.transform = "translate(" + target.offsetLeft + "px, " + target.offsetTop + "px)";
      if (!animate) {
        void thumb.offsetWidth;
        thumb.style.transition = "";
      }
    }

    function placeTabThumb(animate) {
      const target = tabs.find((tab) => tab.dataset.view === view);
      moveThumb(tabThumb, target, animate);
    }

    function applyLang() {
      for (const element of document.querySelectorAll("[data-i18n]")) {
        element.textContent = t(element.dataset.i18n);
      }
      for (const element of document.querySelectorAll("[data-i18n-title]")) {
        element.title = t(element.dataset.i18nTitle);
      }
      for (const element of document.querySelectorAll("[data-i18n-aria]")) {
        element.setAttribute("aria-label", t(element.dataset.i18nAria));
      }
      for (const row of rows) row.text.nodeValue = t(row.rawTitle || "");
      titleEl.textContent = t(currentTitle);
      document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
      document.title = t("Pi Flow 运行环境");
      window.setup?.setLocale?.(lang);
      placeTabThumb(false);
    }

    function syncLangSwitch(animate) {
      for (const button of langButtons) {
        const activeLang = button.dataset.lang === lang;
        button.classList.toggle("active", activeLang);
        button.setAttribute("aria-checked", String(activeLang));
        button.tabIndex = activeLang ? 0 : -1;
      }
      moveThumb(langThumb, langButtons.find((button) => button.dataset.lang === lang), animate);
    }

    function setLang(next, { animate = true } = {}) {
      lang = next === "zh" ? "zh" : "en";
      saveSetupLocale(lang);
      applyLang();
      syncLangSwitch(animate);
    }

    for (const button of langButtons) {
      button.addEventListener("click", () => setLang(button.dataset.lang));
    }

    langSwitchEl.addEventListener("keydown", (event) => {
      const keys = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"];
      if (!keys.includes(event.key)) return;
      event.preventDefault();
      const index = langButtons.findIndex((button) => button.dataset.lang === lang);
      let next = index;
      if (event.key === "Home") next = 0;
      else if (event.key === "End") next = langButtons.length - 1;
      else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
        next = (index - 1 + langButtons.length) % langButtons.length;
      } else {
        next = (index + 1) % langButtons.length;
      }
      setLang(langButtons[next].dataset.lang);
      langButtons[next].focus();
    });

    function switchView(next) {
      view = next;
      installView.classList.toggle("hidden", view !== "install");
      logView.classList.toggle("hidden", view !== "log");
      for (const tab of tabs) tab.classList.toggle("active", tab.dataset.view === view);
      if (view === "log") {
        logDotEl.classList.remove("show");
        logEl.scrollTop = logEl.scrollHeight;
      }
      placeTabThumb(true);
    }

    for (const tab of tabs) tab.addEventListener("click", () => switchView(tab.dataset.view));

    document.getElementById("btnMinimize").addEventListener("click", () => window.setup?.minimize?.());
    document.getElementById("btnClose").addEventListener("click", () => window.setup?.close?.());

    function makeRow(title) {
      const li = document.createElement("li");
      li.className = "step pending";
      const row = document.createElement("div");
      row.className = "row";
      const icon = document.createElement("span");
      icon.className = "icon";
      const label = document.createElement("span");
      label.className = "label";
      const text = document.createTextNode(t(title));
      label.append(text);
      const pct = document.createElement("span");
      pct.className = "pct";
      row.append(icon, label, pct);
      const bar = document.createElement("div");
      bar.className = "bar";
      const fill = document.createElement("i");
      bar.append(fill);
      li.append(row, bar);
      stepsEl.append(li);
      return { li, label, text, pct, fill, rawTitle: title };
    }

    function ensureRow(index, title) {
      while (rows.length < index) rows.push(makeRow(""));
      const row = rows[index - 1];
      if (title && !row.rawTitle) {
        row.rawTitle = title;
        row.text.nodeValue = t(title);
      }
      return row;
    }

    function setStep(state) {
      const { index, title, status } = state;
      if (state.total) total = state.total;
      const row = ensureRow(index, title);
      row.li.className = "step " + status;

      if (status === "running") {
        active = index - 1;
        currentTitle = title || "";
        metaEl.className = "meta";
        metaEl.textContent = "STEP " + index + " / " + (state.total || total) + " · RUNNING";
        titleEl.textContent = t(currentTitle);
        row.pct.textContent = "";
        return;
      }

      row.li.removeAttribute("data-progress");
      row.fill.style.animation = "";
      row.fill.style.width = "";

      if (status === "done") {
        active = -1;
        row.pct.textContent = "100%";
        metaEl.className = "meta";
        if (index === (state.total || total)) {
          metaEl.textContent = "STEP " + total + " / " + total + " · READY";
          currentTitle = "准备完成，正在启动…";
          titleEl.textContent = t(currentTitle);
        } else {
          metaEl.textContent = "STEP " + index + " / " + total + " · DONE";
        }
      }

      if (status === "failed") {
        active = -1;
        row.pct.textContent = "";
        metaEl.className = "meta error";
        metaEl.textContent = "STEP " + index + " / " + (state.total || total) + " · FAILED";
        currentTitle = title || "";
        titleEl.textContent = t(currentTitle);
      }
    }

    function plan(titles) {
      total = titles.length;
      stepsEl.textContent = "";
      rows.length = 0;
      titles.forEach((title) => {
        rows.push(makeRow(title));
      });
      metaEl.className = "meta";
      metaEl.textContent = "STEP 0 / " + total + " · READY";
      currentTitle = "准备安装运行环境…";
      titleEl.textContent = t(currentTitle);
    }

    function append(line) {
      logEl.textContent += t(line) + "\n";
      if (view === "log") logEl.scrollTop = logEl.scrollHeight;

      const match = line.match(/(\d{1,3})\s*%/);
      const row = rows[active];
      if (row && match) {
        const value = Math.max(0, Math.min(100, Number(match[1])));
        row.pct.textContent = value + "%";
        row.li.dataset.progress = "1";
        row.fill.style.animation = "none";
        row.fill.style.width = value + "%";
      }
    }

    window.setup?.onStep((payload) => {
      if (payload?.type === "plan") plan(payload.titles || []);
      else if (payload?.type === "state") setStep(payload);
    });

    window.setup?.onLog(append);

    window.setup?.onError((message) => {
      bannerEl.textContent = message;
      bannerEl.classList.add("show");
      logDotEl.classList.add("show");
      metaEl.className = "meta error";
      if (active >= 0) {
        rows[active].li.className = "step failed";
        metaEl.textContent = "STEP " + (active + 1) + " / " + total + " · FAILED";
      }
    });

    setLang(lang, { animate: false });
    requestAnimationFrame(() => {
      placeTabThumb(false);
      syncLangSwitch(false);
    });
  </script>
</body>
</html>
